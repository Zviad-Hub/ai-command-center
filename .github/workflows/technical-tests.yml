name: Technical Department Tests

on:
  pull_request:
    paths:
      - "technical_manager.py"
      - "stress_test_suite.py"
      - "README.md"
      - "technical_department.py"
      - "technical_agents.py"
      - "department_agents.py"
      - "managers.py"
      - "director.py"
      - "task_manager.py"
      - "main.py"
      - "ai_brain.py"
      - "research_agent.py"
      - "config.py"
      - "tests/**"
      - ".github/workflows/technical-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Technical Department regression tests
        run: |
          python -m unittest discover -s tests -v
