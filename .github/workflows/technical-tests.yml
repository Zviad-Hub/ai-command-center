name: Technical Department Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_quality:
        description: "Run real AI department quality tests (uses Groq API quota)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  technical-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Technical Department regression tests
        run: |
          python -m unittest discover -s tests -v
      - name: Run Director routing stress scorecard
        run: |
          python -c "from stress_test_suite import run_routing_stress_tests; import json; report = run_routing_stress_tests(); print(json.dumps(report, ensure_ascii=False, indent=2)); raise SystemExit(0 if report['status'] == 'PASS' else 1)"

      - name: Run opt-in live AI department quality tests
        # The dedicated provider-preflight branch gets one live validation run; all other PRs remain offline-only.\n        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_live_quality) || (github.event_name == 'pull_request' && github.head_ref == 'fix/live-quality-provider-preflight') }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          AI_FALLBACK_API_URL: ${{ secrets.AI_FALLBACK_API_URL }}
          AI_FALLBACK_MODEL: ${{ secrets.AI_FALLBACK_MODEL }}
        run: |
          python agent_quality_stress_test.py --live

      - name: Upload live AI quality report
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_live_quality) || (github.event_name == 'pull_request' && github.head_ref == 'fix/live-quality-provider-preflight')) && hashFiles('agent_quality_stress_report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-agent-quality-stress-report
          path: agent_quality_stress_report.json
          retention-days: 14
