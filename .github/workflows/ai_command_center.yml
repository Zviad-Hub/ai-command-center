name: AI Command Center

on:
  workflow_dispatch:
    inputs:
      task:
        description: "CEO Task"
        required: true
        type: string
        default: "მომიძებნე საინტერესო საიდუმლო ისტორიის ვიდეოს იდეა"

# Task content and reports are private. Never publish them from a public repository.
permissions:
  contents: read

jobs:
  run-command-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Command Center
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEO_TASK: ${{ inputs.task }}
          AI_COMMAND_CENTER_TASKS_FILE: ${{ runner.temp }}/ai-command-center/tasks.json
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import os
          import sys

          from task_manager import submit_task

          try:
              # Agent prompts and reports must not leak into public Actions logs.
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  record = submit_task(os.environ["CEO_TASK"])

              print(json.dumps({
                  "task_id": record.get("id"),
                  "status": "FINISHED",
                  "departments": record.get("departments", [])
              }, ensure_ascii=False))
          except Exception as error:
              # Keep user prompts, provider responses and exception details out of logs.
              print(json.dumps({
                  "status": "FAILED",
                  "error_type": type(error).__name__
              }))
              sys.exit(1)
          PY

      # Full reports are uploaded only for private repositories.
      - name: Upload private task report
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-command-center-task-report
          path: ${{ runner.temp }}/ai-command-center/tasks.json
          if-no-files-found: error
          retention-days: 7
