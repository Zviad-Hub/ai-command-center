name: AI Command Center

on:
  workflow_dispatch:
    inputs:
      task:
        description: "CEO Task"
        required: true
        type: string
        default: "მომიძებნე საინტერესო საიდუმლო ისტორიის ვიდეოს იდეა"

# Task content and reports are private. Never publish them from a public repository.
permissions:
  contents: read

jobs:
  run-command-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Command Center
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          AI_FALLBACK_API_URL: ${{ secrets.AI_FALLBACK_API_URL }}
          AI_FALLBACK_MODEL: ${{ secrets.AI_FALLBACK_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEO_TASK: ${{ inputs.task }}
          AI_COMMAND_CENTER_TASKS_FILE: ${{ runner.temp }}/ai-command-center/tasks.json
          AI_DIAGNOSTICS_FILE: ${{ runner.temp }}/ai-command-center-diagnostics/diagnostics.json
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          import os
          import sys
          from pathlib import Path

          from task_manager import build_public_task_summary, submit_task

          diagnostics_path = Path(os.environ["AI_DIAGNOSTICS_FILE"])
          diagnostics_path.parent.mkdir(parents=True, exist_ok=True)

          try:
              # Agent prompts and reports must not leak into public Actions logs.
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  record = submit_task(os.environ["CEO_TASK"])

              # This is the same allow-listed, redacted summary printed to the log.
              # It deliberately excludes task text, reports, prompts, URLs and provider bodies.
              summary = build_public_task_summary(record)
              diagnostics_path.write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\\n",
                  encoding="utf-8",
              )
              print(json.dumps(summary, ensure_ascii=False))
          except Exception as error:
              # Keep user prompts, provider responses, credentials and exception details out.
              safe_failure = {
                  "run_status": "FAILED",
                  "error_type": type(error).__name__,
                  "human_review_required": True,
              }
              diagnostics_path.write_text(
                  json.dumps(safe_failure, ensure_ascii=False, indent=2) + "\\n",
                  encoding="utf-8",
              )
              print(json.dumps(safe_failure, ensure_ascii=False))
              sys.exit(1)
          PY

      # This artifact contains only the allow-listed public summary, never tasks.json.
      - name: Upload redacted run diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-command-center-diagnostics
          path: ${{ runner.temp }}/ai-command-center-diagnostics/diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      # Full reports are uploaded only for private repositories.
      - name: Upload private task report
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-command-center-task-report
          path: ${{ runner.temp }}/ai-command-center/tasks.json
          if-no-files-found: error
          retention-days: 7
