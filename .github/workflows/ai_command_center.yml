
name: AI Command Center

on:
  workflow_dispatch:
    inputs:
      task:
        description: "CEO Task"
        required: true
        type: string
        default: "შექმენი ახალი ვიდეოს იდეა საიდუმლო ისტორიაზე"

permissions:
  contents: write

jobs:
  run-command-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Command Center
        env:
          CEO_TASK: ${{ inputs.task }}
        run: |
          python -c "import os; from task_manager import submit_task; submit_task(os.environ['CEO_TASK'])"

      - name: Save task history
        run: |
          git config user.name "AI Command Center"
          git config user.email "ai-command-center@users.noreply.github.com"
          git add tasks.json
          git diff --cached --quiet || git commit -m "Save AI task history"
          git push
