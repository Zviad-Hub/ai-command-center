name: AI Command Center

on:
  workflow_dispatch:
    inputs:
      task:
        description: "CEO Task"
        required: true
        type: string
        default: "მომიძებნე საინტერესო საიდუმლო ისტორიის ვიდეოს იდეა"

# The workflow may run the agents and upload its report,
# but it must never push generated task history into a source branch.
permissions:
  contents: read

jobs:
  run-command-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Command Center
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEO_TASK: ${{ inputs.task }}
        run: |
          python -c "import os; from task_manager import submit_task; submit_task(os.environ['CEO_TASK'])"

      - name: Upload task report
        uses: actions/upload-artifact@v4
        with:
          name: ai-command-center-task-report
          path: tasks.json
          if-no-files-found: error
          retention-days: 14
